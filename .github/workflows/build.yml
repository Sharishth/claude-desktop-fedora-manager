name: Build RPM

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh src/helper build.sh
      - name: pyflakes
        run: pip install pyflakes && python -m pyflakes src/claude-deb2rpm-manager

  rpm:
    needs: lint
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build tools
        run: dnf install -y git tar gzip rpm-build desktop-file-utils
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rpm
